{% extends "_auth.html" %}{% block title %}Quên mật khẩu{% endblock %}
{% block form %}
<h1>Quên mật khẩu</h1><p class="sub">Nhập email, hệ thống gửi liên kết đặt lại mật khẩu (hiệu lực 30 phút).</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
<p style="margin:1.25rem 0 .75rem"><button class="btn" style="width:100%">Gửi liên kết</button></p></form>
{% if dev_link %}<div class="flash warn"><b>Chế độ phát triển (chưa cấu hình SMTP):</b><br><a href="{{ dev_link }}">{{ dev_link }}</a></div>{% endif %}
<p><a href="{{ url_for('login') }}">Quay lại đăng nhập</a></p>
{% endblock %}
