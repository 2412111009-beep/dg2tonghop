{% extends "_auth.html" %}{% block title %}Đặt lại mật khẩu{% endblock %}
{% block form %}
<h1>Đặt mật khẩu mới</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="password">Mật khẩu mới</label><input id="password" name="password" type="password" minlength="6" required autofocus>
<label for="password2">Nhập lại</label><input id="password2" name="password2" type="password" required>
<p style="margin:1.25rem 0"><button class="btn" style="width:100%">Lưu mật khẩu</button></p></form>
{% endblock %}
