services:
  web:
    build: .
    image: labbook:latest
    container_name: labbook
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      LABBOOK_DATA: /data
      SECRET_KEY: ${SECRET_KEY:-}          # để trống thì tự sinh và lưu trong volume
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # đặt 1 khi chạy sau HTTPS
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@lab.local}
    volumes:
      - labbook_data:/data

volumes:
  labbook_data:
